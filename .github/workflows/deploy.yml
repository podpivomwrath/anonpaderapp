name: Deploy to VPS

# Автоматический деплой — ВТОРОЙ этап (см. DEPLOY.md). Сначала должен
# надёжно работать ручной деплой (docker compose build/up на сервере),
# и только потом стоит включать этот workflow.
#
# Нужные GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST        186.246.12.136
#   DEPLOY_USER        пользователь с sudo/docker (см. scripts/server-setup.sh)
#   DEPLOY_SSH_KEY      приватный SSH-ключ (соответствующий authorized_keys на сервере)
#   DEPLOY_PATH         путь к проекту на сервере, напр. /home/deploy/pines

# Запуск ТОЛЬКО вручную (кнопка Run workflow во вкладке Actions).
#
# На пуш он висел с самого начала и ни разу не прошёл: 0 успешных из 105 на
# 2026-09-26, падение за 4 секунды на шаге SSH - секреты выше не заданы.
# Толку от него не было, а на почту на каждый пуш приходило письмо о сбое.
# Деплой всё это время шёл вручную по SSH (scripts/deploy-release.sh).
#
# Чтобы включить автодеплой: задать секреты выше, убедиться, что ручной
# запуск проходит, и вернуть сюда `push: branches: [main]`. Но тогда
# ручной деплой после пуша надо прекратить - иначе два deploy-release.sh
# будут выкатывать одно и то же одновременно.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull origin main
            bash scripts/deploy-release.sh
